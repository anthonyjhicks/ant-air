<section class="modal" data-aircraft-modal hidden>
  <div class="modal__backdrop" data-aircraft-close></div>
  <div
    class="modal__content modal__content--media"
    role="dialog"
    aria-modal="true"
    aria-labelledby="aircraft-lightbox-title"
  >
    <div class="modal__header">
      <h3 id="aircraft-lightbox-title" data-aircraft-modal-title>Aircraft image</h3>
      <button class="button ghost" type="button" data-aircraft-close>Close</button>
    </div>
    <div class="modal__body">
      <img
        class="aircraft-lightbox__image"
        data-aircraft-modal-image
        src=""
        alt=""
        loading="lazy"
      >
    </div>
  </div>
</section>
